<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15130f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Jarvis</title>
<style>
:root{--bg:#15130f;--ink:#ece5d3;--mut:#928a76;--ac:#f0a53a;--on:#1a1305;--sig:#8fd3a9;--bad:#ff7a5c;--ln:#2e2a21;--hr:#2e2a21;--pn:#1d1a14;--ft:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--fm:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--fd:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--r:2px;--rule:1px;--grid:none;--gs:auto}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);scroll-padding-top:env(safe-area-inset-top,0px)}
body{background-color:var(--bg);background-image:var(--grid);background-size:var(--gs);color:var(--ink);font:16px/1.55 var(--ft);display:flex;flex-direction:column;overflow:hidden}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:var(--rule) solid var(--hr);background:var(--pn)}
.ring{width:36px;height:36px;flex:none;color:var(--ac)}
#orb{cursor:pointer}
.ring .a,.ring .d{transform-box:fill-box;transform-origin:center}
.ring.think .a{animation:rot 1.1s linear infinite}
.ring.listen .a{stroke-dasharray:94 0}
.ring.listen .d,.ring.speak .a{animation:pu .9s ease-in-out infinite alternate}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes pu{from{transform:scale(.86)}to{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font:700 18px/1.2 var(--fd)}
#ct{display:block;font:12px/1.3 var(--fm);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb{width:44px;height:44px;flex:none;display:grid;place-items:center;background:transparent;border:1px solid var(--ln);border-radius:var(--r);cursor:pointer}
.strip{display:grid;grid-template-columns:1.2fr 1.2fr .8fr;border-bottom:1px solid var(--ln);font:13px var(--fm)}
.strip div{padding:6px 12px;border-right:1px solid var(--ln);min-width:0}
.strip div:last-child{border-right:0}
.strip small{display:block;color:var(--mut);font-size:11px}
.strip b{font-weight:500}
#msgs{flex:1;overflow-y:auto}
.m{display:grid;grid-template-columns:56px 1fr;padding:12px 14px 12px 10px;border-bottom:1px solid var(--ln)}
.g{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding-left:4px;font:11px var(--fm);color:var(--mut)}
.g .i{width:16px;height:16px}
.user .g .i{color:var(--ac)}
.bot .g .i{color:var(--sig)}
.b{min-width:0;white-space:pre-wrap;word-wrap:break-word}
.user .b{font:15px/1.5 var(--fm)}
.bot .b{font-size:16.5px}
.note{padding:10px 14px 10px 70px;color:var(--mut);font:12.5px/1.45 var(--fm);border-bottom:1px solid var(--ln)}
pre{white-space:pre;overflow-x:auto;background:var(--pn);border:1px solid var(--ln);border-radius:var(--r);padding:8px 10px;margin:6px 0;font:13px/1.45 var(--fm)}
footer{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:var(--rule) solid var(--hr);background:var(--pn)}
.pr{color:var(--ac);display:grid;place-items:center}
#t{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px solid var(--ln);padding:11px 4px;font:16px var(--fm);outline:none}
#t:focus{border-bottom-color:var(--ac)}
#mic{background:var(--ac);color:var(--on);border-color:var(--ac)}
#mic.on{background:var(--bad);border-color:var(--bad)}
#pn{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:9;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.hd{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 16px;border-bottom:var(--rule) solid var(--hr);background:var(--pn);font:700 18px var(--fd)}
.bd{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px}
.btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--pn);border:1px solid var(--ln);border-radius:var(--r);padding:12px 14px;text-align:left;cursor:pointer}
.btn.pri{flex-direction:row;justify-content:center;align-items:center;gap:8px;background:var(--ac);border-color:var(--ac);color:var(--on);font-weight:600}
.btn.cur{border-left:4px solid var(--ac)}
.t2{font:12px var(--fm);color:var(--mut)}
.lb{font-size:13px;color:var(--mut);margin-top:6px}
.in{width:100%;background:var(--pn);border:1px solid var(--ln);border-radius:var(--r);padding:11px;font-size:16px}
.sm{font-size:13px;color:var(--mut);line-height:1.45}
.ths{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.th{display:flex;flex-direction:column;align-items:flex-start;gap:8px;border:1px solid;border-radius:var(--r);padding:10px;font-size:13px;font-weight:600;cursor:pointer}
.th .sw{display:block;width:34px;height:5px;background:var(--ac)}
.th.sel{outline:2px solid var(--ac);outline-offset:2px}
#sh{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:8;background:rgba(0,0,0,.55);align-items:flex-end}
.sheet{width:100%;max-height:90%;overflow-y:auto;background:var(--bg);border-top:var(--rule) solid var(--hr);padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.shh{display:flex;align-items:center;justify-content:space-between;font:700 18px var(--fd)}
.big{display:grid;place-items:center;padding:6px 0}
.big .ring{width:104px;height:104px}
.bigst{text-align:center;font:13px var(--fm);color:var(--mut)}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ln);font:13px var(--fm)}
.kv div{padding:8px 12px;border-bottom:1px solid var(--ln);border-right:1px solid var(--ln)}
.kv div:nth-child(2n){border-right:0}
.kv small{display:block;color:var(--mut);font-size:11px}
.li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--ln)}
.li .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.li.dn .tx{color:var(--mut);text-decoration:line-through}
.qa .btn:last-child:nth-child(odd){grid-column:1/-1}
</style>
</head>
<body>
<header>
  <svg id="orb" class="ring" viewBox="0 0 40 40" role="button" aria-label="Konuşmayı durdur"><circle cx="20" cy="20" r="15" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width="2"/><circle class="a" cx="20" cy="20" r="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="28 66"/><circle class="d" cx="20" cy="20" r="3.5" fill="currentColor"/></svg>
  <div class="ttl"><b>Jarvis</b><span id="ct"></span></div>
  <button class="sb" id="bch" aria-label="Sohbetler"></button>
  <button class="sb" id="vol" aria-label="Sesli yanıt"></button>
  <button class="sb" id="bst" aria-label="Ayarlar"></button>
</header>
<div class="strip"><div><small>kaynak</small><b id="v1"></b></div><div><small>durum</small><b id="v2"></b></div><div><small>hafıza</small><b id="v3"></b></div></div>
<div id="msgs"></div>
<footer>
  <span class="pr" id="pr"></span>
  <input id="t" type="text" placeholder="Komut veya soru yazın" autocomplete="off" enterkeyhint="send" aria-label="Mesaj">
  <button class="sb" id="go" aria-label="Gönder"></button>
  <button class="sb" id="mic" aria-label="Sesle konuş"></button>
</footer>
<div id="pn"></div>
<div id="sh"></div>
<script>
/* OpenAI uyumlu sağlayıcılar. Satır: id, ad, adres, varsayılan model, ipucu. Yeni satır eklemek için skill'deki add_provider.py kullanılır. */
var PRESETS=[
["openai","OpenAI","https://api.openai.com/v1","gpt-4o-mini","Anahtar platform.openai.com adresinden alınır, kullanım ücretlidir. Model adı güncel olmayabilir, değiştirebilirsiniz."],
["groq","Groq","https://api.groq.com/openai/v1","llama-3.3-70b-versatile","Anahtar console.groq.com adresinden alınır. Ücretsiz kullanım sınırları değişebilir. Model adı güncel olmayabilir."],
["openrouter","OpenRouter","https://openrouter.ai/api/v1","openai/gpt-4o-mini","Anahtar openrouter.ai adresinden alınır; tek anahtarla birçok modele erişilir. Model adı güncel olmayabilir."],
["deepseek","DeepSeek","https://api.deepseek.com/v1","deepseek-chat","Anahtar platform.deepseek.com adresinden alınır. Model adı güncel olmayabilir."],
["ozel","Özel (OpenAI uyumlu)","","","Kendi sunucunuzun veya başka bir hizmetin OpenAI uyumlu adresini ve model adını yazın."]
];
function presetOf(id){for(var i=0;i<PRESETS.length;i++)if(PRESETS[i][0]===id)return PRESETS[i];return []}
function isPreset(id){return presetOf(id).length>0}
function isExt(id){return id==="gemini"||id==="anthropic"||isPreset(id)}
function presetOpts(){return PRESETS.map(function(p){return '<option value="'+p[0]+'">'+p[1]+'</option>'}).join("")}
function presetHint(id){return (presetOf(id)[4]||"")+" Sayfa https adresinden açılmalıdır."}
function hasKey(){return ["gemini","anthropic"].concat(PRESETS.map(function(p){return p[0]})).some(function(i){return S.set.k[i]})}

</script>
<script>
var $=function(i){return document.getElementById(i)};
var KEY="jarvis_v2";
var S={chats:[],cur:null,facts:[],notes:[],todos:[],set:{provider:"",speak:true,theme:"",k:{},m:{},b:{}}};
var sample=null,busy=false,rec=null,listening=false,warned=false,state="idle";
var msgs=$("msgs"),orb=$("orb"),inp=$("t");
var LBL={idle:"hazır",listen:"dinliyorum…",think:"düşünüyor…",speak:"konuşuyor…"};
var PN={claude:"Claude",gemini:"Gemini",anthropic:"Anthropic",openai:"OpenAI",offline:"çevrimdışı"};
PRESETS.forEach(function(p){PN[p[0]]=p[1]});
var JOKES=["Neden bilgisayar soğuk almaz? Çünkü hep Windows'u açıktır.","Programcı markete gitmiş: 'Bir ekmek al, yumurta varsa 6 tane al' demişler. Ekmek yerine 6 ekmek almış, çünkü yumurta vardı.","Yapay zekâ kahve içer mi? İçmez ama gece boyu çalışmaya devam eder."];
var HELP="Çevrimdışıyken şunları yapabilirim: saat, tarih, hesaplama, zamanlayıcı ('5 dakika sonra hatırlat'), şaka, yazı-tura, zar ve hafıza ('hatırla: ...'). Diğer sorular için Ayarlar'dan Claude'u veya bir API seçin.";
var OFFDEF="Bu soruyu yanıtlamak için yapay zekâ gerekiyor efendim. Ayarlar'dan Claude'u veya kendi API anahtarınızı seçebilirsiniz. Ne yapabildiğimi öğrenmek için 'ne yapabilirsin' deyin.";

try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);if(o&&o.chats){S.chats=o.chats;S.cur=o.cur;S.facts=o.facts||[];S.notes=o.notes||[];S.todos=o.todos||[];for(var k in o.set)S.set[k]=o.set[k]}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){if(!warned){warned=true;note("Kayıt yapılamıyor: tarayıcı depolaması kapalı.")}}}
function newChat(){var c={id:"c"+Date.now(),title:"Yeni sohbet",ts:Date.now(),msgs:[]};S.chats.unshift(c);S.cur=c.id;save();return c}
function chat(){for(var i=0;i<S.chats.length;i++)if(S.chats[i].id===S.cur)return S.chats[i];return newChat()}
function prov(){var p=S.set.provider;if(!p){if(sample)p="claude";else{p="offline";["gemini","anthropic"].concat(PRESETS.map(function(q){return q[0]})).forEach(function(x){if(p==="offline"&&S.set.k[x])p=x})}}return p}
function setState(s){state=s;var rs=document.querySelectorAll(".ring");for(var i=0;i<rs.length;i++)rs[i].setAttribute("class","ring "+(s==="idle"?"":s));$("v1").textContent=PN[prov()];$("v2").textContent=LBL[s];$("v3").textContent=S.facts.length}
function setTitle(){$("ct").textContent=chat().title}
function scroll(){msgs.scrollTop=msgs.scrollHeight}
function note(t){var d=document.createElement("div");d.className="note";d.textContent=t;msgs.appendChild(d);scroll()}
function renderInto(el,text){
  el.textContent="";
  var parts=text.split("```");
  for(var i=0;i<parts.length;i++){
    var p=parts[i];
    if(i%2===1){var m=p.match(/^([a-zA-Z0-9+#-]*)\n/);var pre=document.createElement("pre");pre.textContent=(m?p.slice(m[0].length):p).replace(/\n$/,"");el.appendChild(pre)}
    else if(p.trim()){var s=document.createElement("span");s.textContent=p.replace(/^\n+|\n+$/g,"");el.appendChild(s)}
  }
  if(!el.firstChild)el.textContent="…";
}
function add(cls,txt,ts){
  var d=document.createElement("div");d.className="m "+cls;
  var g=document.createElement("div");g.className="g";g.innerHTML=ic(cls==="bot"?"ring":"chev");
  var tm=document.createElement("span");tm.textContent=new Date(ts||Date.now()).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});g.appendChild(tm);
  var b=document.createElement("div");b.className="b";
  if(cls==="bot")renderInto(b,txt);else b.textContent=txt;
  d.appendChild(g);d.appendChild(b);msgs.appendChild(d);scroll();return b;
}
function loadChat(){
  msgs.innerHTML="";var c=chat();
  if(!c.msgs.length)add("bot","Merhaba, ben Jarvis. Size nasıl yardımcı olabilirim?");
  c.msgs.forEach(function(m){add(m.r,m.t,m.ts)});setTitle();
  if(!window.claude&&!S.set.provider&&!hasKey())note("Claude bağlantısı yalnızca claude.ai içinde var. Burada kullanmak için ayarlardan bir API anahtarı girin ya da çevrimdışı devam edin.");
}


</script>
<script>
/* Yerel komutlar (API gerektirmez, limit harcamaz) */
function norm(t){return t.toLocaleLowerCase("tr-TR").trim()}
function core(raw){
  var t=norm(raw),m,d=new Date();
  if((m=raw.match(/^(?:lütfen\s+)?(?:(?:bunu|şunu)\s+)?(?:hatırla|aklında tut|aklına yaz)\s*[:,]?\s*(.+)$/i))){
    S.facts.push(m[1].trim());if(S.facts.length>50)S.facts.shift();save();return "Not aldım efendim: "+m[1].trim();
  }
  if((m=raw.match(/^(?:benim\s+)?adım\s+(.+)$/i))){
    S.facts=S.facts.filter(function(f){return f.indexOf("Kullanıcının adı")!==0});
    S.facts.push("Kullanıcının adı "+m[1].trim());save();return "Memnun oldum "+m[1].trim()+", hafızama kaydettim.";
  }
  if(/^(yapılacaklarım|yapılacaklar|görevlerim)(\s+(ne|neler))?\??$/.test(t)){
    var o2=S.todos.filter(function(x){return !x.done});
    return o2.length?"Yapılacaklar:\n"+o2.map(function(x,i){return (i+1)+". "+x.t}).join("\n"):"Açık yapılacak yok.";
  }
  if(/^(notlarım|notlar|notları göster)\??$/.test(t))
    return S.notes.length?"Son notlar:\n- "+S.notes.slice(0,5).map(function(x){return x.t}).join("\n- "):"Henüz not yok.";
  if((m=raw.match(/^(?:lütfen\s+)?not\s*al(?![a-zçğıöşü])\s*[:,]?\s*(.+)$/i))){S.notes.unshift({id:"n"+Date.now(),t:m[1].trim(),ts:Date.now()});save();return "Notu aldım: "+m[1].trim()}
  if((m=raw.match(/^(?:yapılacaklar(?:a)?\s+ekle|yapılacak|görev\s+ekle)(?![a-zçğıöşü])\s*[:,]?\s*(.+)$/i))){S.todos.push({id:"t"+Date.now(),t:m[1].trim(),done:false,ts:Date.now()});save();return "Yapılacaklara ekledim: "+m[1].trim()}
  if((m=raw.match(/^(?:yapıldı|tamamla|bitti)(?![a-zçğıöşü])\s*[:,]?\s*(.+)$/i))){
    var op=S.todos.filter(function(x){return !x.done}),q=norm(m[1]),hit=null;
    if(/^\d+$/.test(q))hit=op[+q-1];else op.forEach(function(x){if(!hit&&norm(x.t).indexOf(q)>-1)hit=x});
    if(!hit)return "Bu yapılacağı bulamadım. Numarasını veya bir kelimesini söyleyin.";
    hit.done=true;save();return "Tamamlandı: "+hit.t;
  }
  if(/(neleri|neyi|ne)\s+hatırlıyorsun|hafızanda ne var/.test(t))
    return S.facts.length?"Hatırladıklarım:\n- "+S.facts.join("\n- "):"Henüz bir şey kaydetmedim. 'Hatırla: ...' diyerek bana bilgi verebilirsiniz.";
  if(/(hafızayı|hafızanı)\s+(unut|temizle|sil)|her şeyi unut/.test(t)){S.facts=[];save();return "Hafızamı temizledim efendim."}
  if(/saat kaç/.test(t))return "Saat "+d.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})+" efendim.";
  if(/(günlerden ne|bugünün tarihi|tarih ne|ayın kaçı|hangi gündeyiz)/.test(t))return "Bugün "+d.toLocaleDateString("tr-TR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})+".";
  var e=t.replace(/(kaç eder|hesapla|eşittir|=|\?)/g,"").replace(/[x×]/g,"*").replace(/÷/g,"/").replace(/\^/g,"**").replace(/,/g,".").replace(/\s+/g,"");
  if(/^[\d+\-*\/().%]+$/.test(e)&&/\d[+\-*\/%]/.test(e)){
    try{var r=Function('"use strict";return ('+e+')')();if(typeof r==="number"&&isFinite(r))return "Sonuç: "+String(Math.round(r*1e6)/1e6).replace(".",",")}catch(x){}
  }
  if((m=t.match(/(\d+)\s*(saniye|sn|dakika|dk|saat)/))&&/(hatırlat|zamanlayıcı|sayaç|alarm|uyar)/.test(t)){
    var n=+m[1],u=m[2],ms=n*(u==="saat"?3600000:(u==="dakika"||u==="dk")?60000:1000);
    if(ms>21600000)return "En fazla 6 saatlik zamanlayıcı kurabilirim efendim.";
    var what=raw.replace(/\d+\s*(saniye|sn|dakika|dk|saat)\s*(sonra|içinde)?/i,"").replace(/(bana|beni)?\s*(hatırlat|uyar)\S*/i,"").replace(/[.!?]/g,"").trim();
    setTimeout(function(){var s="Efendim, süre doldu"+(what?": "+what:".");add("bot",s);speak(s);try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(x){}},ms);
    return "Tamam, "+n+" "+u+" sonra hatırlatacağım. Sayfanın açık kalması gerekir.";
  }
  return null;
}
function chit(t){
  if(/^(merhaba|selam|hey|günaydın|iyi akşamlar)/.test(t))return "Merhaba efendim, nasıl yardımcı olabilirim?";
  if(/teşekkür|sağ ol/.test(t))return "Rica ederim efendim.";
  if(/adın ne|kimsin/.test(t))return "Ben Jarvis, kişisel asistanınız.";
  if(/şaka|fıkra/.test(t))return JOKES[Math.floor(Math.random()*JOKES.length)];
  if(/yazı tura/.test(t))return Math.random()<.5?"Yazı geldi.":"Tura geldi.";
  if(/zar at/.test(t))return "Zar: "+(1+Math.floor(Math.random()*6));
  if(/ne yapabilirsin|yardım/.test(t))return HELP;
  return null;
}


function agendaCtx(){
  var o=S.todos.filter(function(x){return !x.done}).slice(0,10).map(function(x){return x.t.slice(0,80)});
  var n=S.notes.slice(0,5).map(function(x){return x.t.slice(0,80)});
  return (o.length?" Kullanıcının açık yapılacakları: "+o.join("; ")+".":"")+(n.length?" Son notları: "+n.join("; ")+".":"");
}

</script>
<script>
var FONTS={mono:'ui-monospace,"SF Mono",Menlo,Consolas,monospace',sans:'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif',serif:'"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif',slab:'Rockwell,"Roboto Slab","Courier New",Georgia,serif',round:'ui-rounded,"SF Pro Rounded",Nunito,"Varela Round",system-ui,sans-serif',cond:'"Arial Narrow","Roboto Condensed","Helvetica Neue",Arial,sans-serif'};
/* id, ad, zemin, mürekkep, soluk, vurgu, vurgu-üstü, sinyal, çizgi, panel, metin, başlık, köşe, doku, kural(1 ince, 2 kalın mürekkep, 3 ince mürekkep) */

function lum(h){var c=hexRGB(h);return (c[0]*299+c[1]*587+c[2]*114)/255000}
function curTheme(){

  for(i=0;i<THEMES.length;i++)if(THEMES[i][0]===(light?"defter":"kokpit"))return THEMES[i];

}

<script>
function initAI(){
try{if(window.claude&&claude.use){claude.use("sample").then(function(s){sample=s;setState(state)}).catch(function(){})}}catch(e){}
}
/* Yapay zekâ */
function sysPrompt(){
  var now=new Date().toLocaleString("tr-TR",{dateStyle:"full",timeStyle:"short"});
  return "Sen JARVIS'sin: Tony Stark'ın zeki, kibar, hafif esprili yapay zekâ asistanı. Varsayılan olarak Türkçe yanıt ver; kullanıcı başka bir dilde konuşmanı veya yanıtlamanı isterse o dilde yanıt ver. Kullanıcıya ara sıra 'efendim' diyebilirsin. "+
    "Soruyu tam ve doğru yanıtla: basit sorulara kısa, istendiğinde (liste, kod, açıklama, yazı) eksiksiz ve ayrıntılı yanıt ver. "+
    "Kod için ``` bloğu kullan; başlık ve kalın yazı (**) kullanma, listelerde '-' kullan. "+
    "Canlı veriye (hava durumu, haber, borsa) erişimin yok; uydurma, bunu açıkça söyle. Şu anki tarih ve saat: "+now+"."+
    (S.facts.length?" Kullanıcı hakkında hatırladıkların: "+S.facts.join("; ")+".":"")+agendaCtx();
}
var DEF={anthropic:"claude-sonnet-5-5",gemini:"gemini-2.5-flash"};
PRESETS.forEach(function(p){DEF[p[0]]=p[3]});
function fixModel(p,m){
  m=(m||"").trim();if(!m)return DEF[p];
  if(p==="gemini"){var l=m.toLowerCase();
    if(/flash/.test(l)&&/2\.5/.test(l))return /lite/.test(l)?"gemini-2.5-flash-lite":"gemini-2.5-flash";
    if(/pro/.test(l)&&/2\.5/.test(l))return "gemini-2.5-pro";
    return l.replace(/\s+/g,"-");}
  return m;
}
async function callAI(p,hist,q,onText){
  var sys=sysPrompt();
  if(p==="claude"){
    if(!sample)throw {code:"nosample"};
    var tr=hist.map(function(h){return (h.r==="user"?"Kullanıcı: ":"Jarvis: ")+h.t.slice(0,1000)}).join("\n");
    var r=await sample(sys+"\n\n"+(tr?"Önceki konuşma:\n"+tr+"\n\n":"")+"Kullanıcının son mesajı: "+q+"\n\nJarvis olarak yanıtla:",{cache:false,modelTier:"default",onText:onText});
    return (r&&r.text)||"";
  }
  var key=(S.set.k[p]||"").trim();
  if(!key)throw {code:"nokey"};
  var model=fixModel(p,S.set.m[p]);
  var ms=hist.map(function(h){return {role:h.r==="user"?"user":"assistant",content:h.t.slice(0,2000)}});
  while(ms.length&&ms[0].role!=="user")ms.shift();
  ms.push({role:"user",content:q});
  var res,data;
  if(p==="gemini"){
    var gm=ms.map(function(m){return {role:m.role==="user"?"user":"model",parts:[{text:m.content}]}});
    res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(model)+":generateContent?key="+encodeURIComponent(key),{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:gm})});
    if(!res.ok)throw {status:res.status,msg:await res.text()};
    data=await res.json();
    var pt=data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts;
    return (pt||[]).map(function(x){return x.text||""}).join("");
  }
  if(p==="anthropic"){
    res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:model,max_tokens:1500,system:sys,messages:ms})});
    if(!res.ok)throw {status:res.status,msg:await res.text()};
    data=await res.json();return (data.content||[]).map(function(c){return c.text||""}).join("");
  }
  var base=(S.set.b[p]||presetOf(p)[2]||"").replace(/\/+$/,"");if(!base)throw {code:"nobase"};
  res=await fetch(base+"/chat/completions",{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+key},body:JSON.stringify({model:model,messages:[{role:"system",content:sys}].concat(ms)})});
  if(!res.ok)throw {status:res.status,msg:await res.text()};
  data=await res.json();return (data.choices&&data.choices[0]&&data.choices[0].message.content)||"";
}
function errMsg(e){
  var c=e&&e.code;
  if(c==="nosample")return "Claude bağlantısı yok. Sayfayı claude.ai içinden açın ya da Ayarlar'dan başka bir seçenek seçin.";
  if(c==="nobase")return "Adres girilmemiş. Ayarlardan OpenAI uyumlu adresi yazın.";
  if(c==="nokey")return "API anahtarı girilmemiş. Ayarlar'dan ekleyin.";
  if(c==="not_granted")return "İzin verilmedi. Tekrar denediğinizde izin isteyeceğim.";
  if(c==="rate_limited")return "Çok hızlı gidiyoruz efendim, birkaç saniye bekleyip tekrar deneyin.";
  if(e&&e.status)return "API hatası ("+e.status+"): "+String(e.msg||"").slice(0,150);
  if(e&&e.name==="TypeError")return "API'ye bağlanılamadı. İnternetinizi kontrol edin. Sayfa claude.ai içinde veya content:// gibi yerel bir adresten açıldıysa dış API'lere bağlanamaz; sayfayı https adresinden açın.";
  return "Bir sorun oluştu, lütfen tekrar deneyin.";
}
function commit(c,t,out){
  var now=Date.now();c.msgs.push({r:"user",t:t,ts:now},{r:"bot",t:out,ts:now});
  if(c.msgs.length>200)c.msgs=c.msgs.slice(-200);
  if(c.title==="Yeni sohbet")c.title=t.slice(0,32);
  c.ts=Date.now();save();setTitle();setState(state);
}
async function ask(raw){
  var t=(raw||"").trim();if(!t||busy)return;
  if(window.speechSynthesis)speechSynthesis.cancel();
  var c=chat(),p=prov();
  add("user",t);
  var loc=core(t);
  if(loc===null&&p==="offline")loc=chit(norm(t))||OFFDEF;
  if(loc!==null){commit(c,t,loc);add("bot",loc);setState("idle");speak(loc);return}
  busy=true;setState("think");
  var el=add("bot","…");
  try{
    var out=((await callAI(p,c.msgs.slice(-16),t,function(o){renderInto(el,o.text);scroll()}))||"").trim()||"Yanıt alamadım efendim, tekrar dener misiniz?";
    renderInto(el,out);commit(c,t,out);speak(out);
  }catch(e){renderInto(el,errMsg(e))}
  busy=false;if(state==="think")setState("idle");
}

/* Giriş */
function send(){var v=inp.value;inp.value="";ask(v)}
function initInput(){
$("go").onclick=send;
inp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();send()}});
}

</script>
<script>
var voiceOn=false,vErr=0;
function setVoice(on){
  voiceOn=on;vErr=0;
  if(on){note("Sesli sohbet açık. Konuşun; kapatmak için halkaya dokunup Komuta merkezini açın.");voiceNext(0)}
  else{try{if(rec)rec.stop()}catch(e){}if(window.speechSynthesis)speechSynthesis.cancel();setState("idle")}
}
function voiceNext(d){
  if(!voiceOn)return;
  setTimeout(function(){
    if(!voiceOn||busy||listening)return;
    if(window.speechSynthesis&&speechSynthesis.speaking)return;
    var m=$("mic");if(m.onclick)m.click();
  },d===undefined?500:d);
}
/* Seslendirme */
function speakable(t){
  var s=t.replace(/```[\s\S]*?(```|$)/g," Kodu ekrana yazdım. ").replace(/[*_#`>~|]/g,"").replace(/^\s*-\s+/gm,"").replace(/\s+/g," ").trim();
  if(s.length>500){s=s.slice(0,500);var i=Math.max(s.lastIndexOf(". "),s.lastIndexOf("? "),s.lastIndexOf("! "));if(i>150)s=s.slice(0,i+1);s+=" Devamı ekranda."}
  return s;
}
function speak(text){
  if(!S.set.speak||!window.speechSynthesis){voiceNext();return}
  try{
    speechSynthesis.cancel();
    var c=speakable(text);if(!c){voiceNext();return}
    var lg=/[\u0600-\u06FF]/.test(c)?"ar-SA":/[\u0400-\u04FF]/.test(c)?"ru-RU":"tr-TR";var u=new SpeechSynthesisUtterance(c);u.lang=lg;
    var v=speechSynthesis.getVoices();for(var i=0;i<v.length;i++){if(v[i].lang.slice(0,2).toLowerCase()===lg.slice(0,2).toLowerCase()){u.voice=v[i];break}}
    u.onstart=function(){setState("speak")};
    u.onend=u.onerror=function(){setState("idle");voiceNext()};
    speechSynthesis.speak(u);
  }catch(e){setState("idle")}
}


function initVoice(){

var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){$("mic").style.display="none";note("Bu tarayıcı sesli komutu desteklemiyor. Yazabilir veya klavyedeki mikrofon simgesiyle dikte edebilirsiniz.")}
else{
  $("mic").onclick=function(){
    if(listening){try{rec.stop()}catch(e){}return}
    if(window.speechSynthesis)speechSynthesis.cancel();
    try{
      rec=new SR();rec.lang="tr-TR";rec.interimResults=false;
      rec.onstart=function(){listening=true;$("mic").classList.add("on");setState("listen")};
      rec.onresult=function(e){var s=e.results[0]&&e.results[0][0]&&e.results[0][0].transcript;if(s){vErr=0;ask(s)}};
      rec.onerror=function(e){
        var er=e.error;if(er==="not-allowed"||er==="service-not-allowed")voiceOn=false;else if(er==="no-speech"||er==="aborted"){vErr++;if(voiceOn&&vErr>=3){voiceOn=false;note("Sesli sohbet durdu: ses algılanmadı.")}}
        if(er==="not-allowed"||er==="service-not-allowed")note("Bu pencere mikrofon iznini engelliyor (claude.ai güvenlik kısıtı olabilir). Klavyenizdeki mikrofon simgesiyle dikte edin; sonuç yazı kutusuna gelir.");
        else if(er==="no-speech")note("Ses algılanmadı, tekrar deneyin.");
        else if(er==="audio-capture")note("Mikrofon bulunamadı.");
        else if(er==="network")note("Ses tanıma servisine ulaşılamadı.");
      };
      rec.onend=function(){listening=false;$("mic").classList.remove("on");if(!busy&&state==="listen")setState("idle");if(voiceOn&&!busy)voiceNext()};
      rec.start();
    }catch(e){note("Mikrofon başlatılamadı. Klavyedeki mikrofonla dikte edebilirsiniz.");listening=false}
  };
}

}

  '<div class="lb">Yapay zekâ kaynağı</div><select class="in" id="pv"><option value="">Otomatik</option><option value="claude">Claude (yerleşik, anahtarsız)</option><option value="gemini">Google Gemini</option><option value="anthropic">Anthropic API</option>'+presetOpts()+'<option value="offline">Çevrimdışı (API yok)</option></select>'+
  '<div id="kf"><div class="lb">API anahtarı</div><input class="in" id="pk" type="password" autocomplete="off"><div class="lb">Model (boşsa varsayılan)</div><input class="in" id="pm" type="text" autocapitalize="off"><div id="bf"><div class="lb">Adres</div><input class="in" id="pb2" type="text"></div></div>'+
  '<div class="sm" id="ph"></div><div class="row"><button class="btn pri" id="sv" style="flex:1">Kaydet</button><button class="btn" id="ts">Bağlantıyı dene</button></div><div class="sm" id="tr"></div>'+
  '<div class="lb">Hafıza</div><div class="sm" id="fl"></div><button class="btn" id="cf">Hafızayı sil</button><button class="btn" id="ca">Tüm sohbetleri sil</button>';
  var ths=$("ths"),cur=curTheme()[0];
  THEMES.forEach(function(t){
    var tb=mk("button","th"+(cur===t[0]?" sel":""));
    tb.style.backgroundColor=t[2];tb.style.color=t[3];tb.style.borderColor=t[8];tb.style.fontFamily=FONTS[t[10]];
    tb.innerHTML='<i class="sw"></i><span></span>';tb.firstChild.style.background=t[5];tb.lastChild.textContent=t[1];
    tb.onclick=function(){S.set.theme=t[0];save();applyTheme();var all=ths.children;for(var i=0;i<all.length;i++)all[i].classList.remove("sel");tb.classList.add("sel")};
    ths.appendChild(tb);
  });
  function fill(){
    var p=$("pv").value,ext=isExt(p);
    $("kf").style.display=ext?"block":"none";$("bf").style.display=isPreset(p)?"block":"none";
    $("pk").value=S.set.k[p]||"";$("pm").value=S.set.m[p]||"";$("pm").placeholder=DEF[p]||"";$("pb2").value=S.set.b[p]||presetOf(p)[2]||"";
    $("ph").textContent=HINT[p]||presetHint(p);
  }
  function store(){
    var p=$("pv").value;S.set.provider=p;
    if(isExt(p)){S.set.k[p]=$("pk").value.trim();S.set.m[p]=$("pm").value.trim();if(isPreset(p))S.set.b[p]=$("pb2").value.trim()}
    save();
  }
  $("pv").value=S.set.provider;fill();$("pv").onchange=fill;
  $("fl").textContent=S.facts.length?S.facts.join("  /  "):"Boş. 'Hatırla: ...' diyerek ekleyebilirsiniz.";
  $("sv").onclick=function(){store();closePn()};
  $("ts").onclick=async function(){
    store();var p=prov(),o=$("tr");
    if(p==="offline"){o.textContent="Çevrimdışı modda bağlantı gerekmez.";return}
    o.textContent="Deneniyor…";
    try{var r=await callAI(p,[],"Yalnızca 'hazır' yaz.",function(){});o.textContent="Bağlantı çalışıyor ("+PN[p]+"): "+String(r).trim().slice(0,60)}
    catch(e){o.textContent=errMsg(e)}
  };
  $("cf").onclick=function(){S.facts=[];save();$("fl").textContent="Hafıza temizlendi.";setState(state)};
  var armed=false;
  $("ca").onclick=function(){
    if(!armed){armed=true;$("ca").textContent="Emin misiniz? Silmek için tekrar dokunun";return}
    S.chats=[];S.cur=null;save();chat();loadChat();closePn();
  };
}
function listPanel(){
  var keep=$("pb")?$("pb").scrollTop:0,b=pnHead("Defter");
  function addRow(label,ph,onAdd){
    b.appendChild(mk("div","lb",label));
    var r=mk("div","row"),i=mk("input","in");i.type="text";i.placeholder=ph;i.setAttribute("enterkeyhint","done");
    var a=mk("button","btn pri","Ekle");
    function go(){var v=i.value.trim();if(v){onAdd(v);save();listPanel()}}
    a.onclick=go;i.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();go()}});
    r.appendChild(i);r.appendChild(a);b.appendChild(r);
  }
  addRow("Yapılacaklar","Yeni yapılacak",function(v){S.todos.push({id:"t"+Date.now(),t:v,done:false,ts:Date.now()})});
  var items=S.todos.filter(function(x){return !x.done}).concat(S.todos.filter(function(x){return x.done}));
  if(!items.length)b.appendChild(mk("div","sm","Henüz yapılacak yok."));
  items.forEach(function(x){
    var r=mk("div","li"+(x.done?" dn":""));
    var c=mk("button","sb");c.setAttribute("aria-label",x.done?"Geri al":"Tamamla");c.innerHTML=ic(x.done?"cbox":"box");
    c.onclick=function(){x.done=!x.done;save();listPanel()};
    var d=mk("button","sb");d.setAttribute("aria-label","Sil");d.innerHTML=ic("trash");
    d.onclick=function(){S.todos=S.todos.filter(function(y){return y!==x});save();listPanel()};
    r.appendChild(c);r.appendChild(mk("span","tx",x.t));r.appendChild(d);b.appendChild(r);
  });
  addRow("Notlar","Yeni not",function(v){S.notes.unshift({id:"n"+Date.now(),t:v,ts:Date.now()})});
  if(!S.notes.length)b.appendChild(mk("div","sm","Henüz not yok."));
  S.notes.forEach(function(x){
    var r=mk("div","li"),d=mk("button","sb");d.setAttribute("aria-label","Sil");d.innerHTML=ic("trash");
    d.onclick=function(){S.notes=S.notes.filter(function(y){return y!==x});save();listPanel()};
    var tx=mk("span","tx",x.t);tx.appendChild(document.createElement("br"));tx.appendChild(mk("small","t2",new Date(x.ts).toLocaleDateString("tr-TR")));
    r.appendChild(tx);r.appendChild(d);b.appendChild(r);
  });
  b.scrollTop=keep;
}
function initUI(){
$("bch").onclick=chatsPanel;$("bst").onclick=setPanel;$("vol").onclick=toggleVol;
[["bch","list"],["bst","set"],["go","send"],["mic","mic"],["pr","chev"]].forEach(function(a){$(a[0]).innerHTML=ic(a[1])});
}

</script>
<script>
function closeSheet(){$("sh").style.display="none";setState(state)}
function openSheet(){
  var sh=$("sh"),today=new Date().toDateString(),n=0;
  S.chats.forEach(function(c){c.msgs.forEach(function(m){if(m.r==="user"&&m.ts&&new Date(m.ts).toDateString()===today)n++})});
  var okSR=!!(window.SpeechRecognition||window.webkitSpeechRecognition);
  sh.innerHTML='<div class="sheet" role="dialog" aria-label="Komuta merkezi"><div class="shh"><span>Komuta merkezi</span><button class="sb" id="shx" aria-label="Kapat">'+ic("x")+'</button></div>'+
  '<div class="big">'+$("orb").outerHTML.replace('id="orb"','id="orb2"')+'</div><div class="bigst" id="bst2"></div>'+
  '<button class="btn pri" id="vm"></button><div class="sm" id="vmh"></div>'+
  '<div class="qa"><button class="btn" id="q1">Zamanlayıcı kur</button><button class="btn" id="q2">Bir şey hatırlat</button><button class="btn" id="q5">Not al</button><button class="btn" id="q6">Yapılacak ekle</button><button class="btn" id="q7">Defteri aç</button><button class="btn" id="q4">Yeni sohbet</button><button class="btn" id="q3">Konuşmayı sustur</button></div>'+
  '<div class="kv"><div><small>tarih</small><span id="k1"></span></div><div><small>kaynak</small><span id="k2"></span></div><div><small>hafıza kaydı</small><span id="k3"></span></div><div><small>bugünkü komut</small><span id="k4"></span></div><div><small>açık yapılacak</small><span id="k5"></span></div><div><small>not</small><span id="k6"></span></div></div></div>';
  $("bst2").textContent=LBL[state];
  $("k1").textContent=new Date().toLocaleDateString("tr-TR",{weekday:"long",day:"numeric",month:"long"});
  $("k2").textContent=PN[prov()];$("k3").textContent=S.facts.length;$("k4").textContent=n;$("k5").textContent=S.todos.filter(function(x){return !x.done}).length;$("k6").textContent=S.notes.length;
  $("vm").textContent=voiceOn?"Sesli sohbeti durdur":"Sesli sohbeti başlat";
  $("vmh").textContent=okSR?"Eller serbest: dinler, yanıtlar, yeniden dinler. Mikrofon izni gerekir.":"Bu tarayıcı sesli komutu desteklemiyor.";
  $("vm").onclick=function(){if(!okSR)return;setVoice(!voiceOn);closeSheet()};
  function pre(t){closeSheet();inp.value=t;inp.focus()}
  $("q1").onclick=function(){pre("5 dakika sonra hatırlat: ")};
  $("q2").onclick=function(){pre("Hatırla: ")};
  $("q5").onclick=function(){pre("Not al: ")};
  $("q6").onclick=function(){pre("Yapılacak: ")};
  $("q7").onclick=function(){closeSheet();listPanel()};
  $("q3").onclick=function(){if(window.speechSynthesis)speechSynthesis.cancel();closeSheet()};
  $("q4").onclick=function(){newChat();loadChat();closeSheet()};
  $("shx").onclick=closeSheet;
  sh.onclick=function(e){if(e.target===sh)closeSheet()};
  sh.style.display="flex";
}
function initSheet(){$("orb").onclick=openSheet}

</script>
<script>
applyTheme();initUI();initVoice();initAI();initInput();initSheet();
setVol();chat();loadChat();setState("idle");
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){navigator.serviceWorker.register("sw.js").catch(function(){})}

</script>
